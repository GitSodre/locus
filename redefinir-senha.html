<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Locus - Redefinir senha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
</head>

<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="logo">Locus.</h1>

      <p class="instrucao">Crie sua nova senha numérica de 6 dígitos.</p>

      <label class="campo-pin-label" for="pin1">Nova senha</label>
      <input type="password" id="pin1" class="campo-pin" placeholder="••••••"
             inputmode="numeric" maxlength="6" autocomplete="new-password" />

      <label class="campo-pin-label" for="pin2">Confirme a senha</label>
      <input type="password" id="pin2" class="campo-pin" placeholder="••••••"
             inputmode="numeric" maxlength="6" autocomplete="new-password" />

      <button id="btnRedefinir" type="button">Redefinir senha</button>

      <p id="msg" class="msg-feedback"></p>
    </div>
  </div>

  <script src="js/lib/supabase-2.116.0.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/redefinir-senha.js"></script>
</body>
</html>
