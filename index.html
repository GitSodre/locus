<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Locus - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="login-page">

  <!--
    login-wrap: mantém o card centralizado e a assinatura logo abaixo,
    alinhada à ESQUERDA do card (fora da caixa).
  -->
  <div class="login-wrap">
    <!-- CARD DE LOGIN (logo continua dentro da caixa) -->
    <div class="login-card">
      <h1 class="logo">Locus.</h1>

      <input type="email" id="login" placeholder="Email" autocomplete="username" />

      <div class="senha-wrapper">
        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" />
        <span id="toggleSenha" class="olho" aria-label="Mostrar/ocultar senha" role="button">👁</span>
      </div>

      <button id="btnEntrar" type="button">Entrar</button>
      <!--<h2 class="assinatura">Lucas.Soares</h2>-->
    </div>

    <!-- ASSINATURA: fora do card, colada abaixo e alinhada à esquerda -->
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
