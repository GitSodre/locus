<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Locus - Recuperar senha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
</head>

<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="logo">Locus.</h1>

      <p class="instrucao">
        Informe seu email de acesso. Se ele estiver cadastrado, você
        receberá um link para redefinir sua senha.
      </p>

      <input type="email" id="email" placeholder="Email" autocomplete="username" />

      <button id="btnEnviar" type="button">Enviar link</button>
      <a href="index.html" class="link-secundario">Voltar para o login</a>

      <p id="msg" class="msg-feedback"></p>
    </div>
  </div>

  <script src="js/lib/supabase-2.116.0.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/recuperar-senha.js"></script>
</body>
</html>
